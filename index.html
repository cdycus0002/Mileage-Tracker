<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mileage" />
  <title>Mileage Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0f1923; }
    #root { height: 100%; }
    .root { font-family: 'DM Sans', sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: #0f1923; display: flex; flex-direction: column; color: #e8edf2; }
    .header { background: #0f1923; padding: 52px 18px 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #1e2d3d; }
    .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .header-icon { width: 34px; height: 34px; background: #e84545; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: #4a6785; font-weight: 500; letter-spacing: 0.5px; }
    .header-right { margin-left: auto; }
    .settings-btn { background: none; border: none; color: #4a6785; font-size: 20px; cursor: pointer; padding: 4px; }
    .summary-row { display: flex; gap: 10px; }
    .sum-card { flex: 1; border-radius: 10px; padding: 10px 14px; }
    .sum-card-amber { background: linear-gradient(135deg, #2a1f0a, #3d2d0f); border: 1px solid #5c420f; }
    .sum-card-green { background: linear-gradient(135deg, #0a2010, #0f2e18); border: 1px solid #1a5c2a; }
    .sum-label { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px; }
    .sum-label-amber { color: #c4891e; }
    .sum-label-green { color: #2e9e50; }
    .sum-value { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; line-height: 1; }
    .sum-value-amber { color: #f5c842; }
    .sum-value-green { color: #3ed670; }
    .tabs { display: flex; background: #0f1923; border-bottom: 1px solid #1e2d3d; position: sticky; top: 145px; z-index: 9; }
    .tab-btn { flex: 1; padding: 12px 0; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; color: #4a6785; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab-btn.active { color: #e84545; border-bottom-color: #e84545; font-weight: 700; }
    .content { flex: 1; padding: 14px 14px 100px; overflow-y: auto; }
    .empty-state { text-align: center; color: #2e4a5f; margin-top: 70px; font-size: 15px; line-height: 1.8; }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .week-hdr { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; margin: 16px 0 6px; border-left: 3px solid #e84545; }
    .week-hdr:first-child { margin-top: 4px; }
    .week-hdr-label { font-size: 12px; font-weight: 700; color: #7a9bb5; }
    .week-hdr-total { font-family: 'DM Mono', monospace; font-size: 12px; color: #e84545; }
    .card { display: flex; align-items: center; background: #141f2b; border: 1px solid #1e2d3d; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; gap: 10px; transition: opacity 0.2s; }
    .card.reported { opacity: 0.45; border-color: #152515; }
    .card-body { flex: 1; min-width: 0; }
    .card-date { font-size: 10px; color: #4a6785; font-weight: 500; letter-spacing: 0.3px; margin-bottom: 3px; }
    .card-job { font-size: 14px; font-weight: 600; color: #d0dce8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .card-miles { font-family: 'DM Mono', monospace; font-size: 13px; color: #2e75b6; }
    .card-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid #2e4a5f; background: transparent; font-size: 15px; cursor: pointer; color: #2e4a5f; display: flex; align-items: center; justify-content: center; }
    .icon-btn.check.done { background: #0f2e18; border-color: #1a5c2a; color: #3ed670; }
    .icon-btn.edit { border-color: #2e4a5f; color: #4a6785; font-size: 13px; }
    .icon-btn.del { border-color: transparent; color: #3a2020; font-size: 12px; }
    .fab { position: fixed; bottom: 28px; right: 20px; width: 58px; height: 58px; border-radius: 16px; background: #e84545; color: white; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 8px 24px rgba(232,69,69,0.4); z-index: 20; display: flex; align-items: center; justify-content: center; font-weight: 300; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 30; display: flex; align-items: flex-end; }
    .modal { background: #141f2b; border-radius: 20px 20px 0 0; padding: 24px 20px 44px; width: 100%; max-width: 480px; margin: 0 auto; border-top: 1px solid #1e2d3d; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .modal-title { font-size: 17px; font-weight: 700; color: #e8edf2; }
    .modal-close { width: 30px; height: 30px; border-radius: 8px; border: none; background: #1e2d3d; cursor: pointer; color: #7a9bb5; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .field-label { font-size: 11px; font-weight: 700; color: #4a6785; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; margin-top: 16px; display: block; }
    .field-input { width: 100%; padding: 12px 14px; background: #0f1923; border: 1px solid #1e2d3d; border-radius: 10px; font-size: 15px; font-family: 'DM Sans', sans-serif; color: #e8edf2; outline: none; }
    .field-input:focus { border-color: #e84545; }
    .submit-btn { width: 100%; padding: 15px; background: #e84545; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 24px; font-family: 'DM Sans', sans-serif; }
    .week-card { background: #141f2b; border: 1px solid #1e2d3d; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .week-card-hdr { padding: 12px 16px; background: #0f1923; border-bottom: 1px solid #1e2d3d; }
    .week-card-title { font-size: 12px; font-weight: 700; color: #7a9bb5; }
    .week-card-total { font-family: 'DM Mono', monospace; font-size: 13px; color: #e84545; margin-top: 3px; }
    .week-row { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid #0f1923; gap: 10px; }
    .week-row:last-child { border-bottom: none; }
    .row-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
    .row-dot-green { background: #3ed670; }
    .row-dot-gray { background: #2e4a5f; }
    .row-label { flex: 1; font-size: 13px; color: #7a9bb5; font-weight: 500; }
    .row-miles { font-family: 'DM Mono', monospace; font-size: 12px; color: #4a6785; margin-right: 8px; }
    .row-pay { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; min-width: 64px; text-align: right; }
    .row-pay-green { color: #3ed670; }
    .row-pay-muted { color: #f5c842; }
    .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .confirm-box { background: #141f2b; border: 1px solid #1e2d3d; border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 320px; text-align: center; }
    .confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .confirm-sub { font-size: 13px; color: #4a6785; margin-bottom: 22px; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-cancel { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #1e2d3d; background: transparent; color: #7a9bb5; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
    .confirm-ok { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #e84545; color: white; font-size: 14px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; }

    /* PIN screen */
    .pin-screen { position: fixed; inset: 0; background: #0f1923; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; max-width: 480px; margin: 0 auto; }
    .pin-icon { font-size: 40px; margin-bottom: 16px; }
    .pin-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .pin-sub { font-size: 13px; color: #4a6785; margin-bottom: 40px; text-align: center; line-height: 1.5; }
    .pin-dots { display: flex; gap: 16px; margin-bottom: 48px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 8px; border: 2px solid #2e4a5f; background: transparent; transition: all 0.15s; }
    .pin-dot.filled { background: #e84545; border-color: #e84545; }
    .pin-dot.error { background: #e84545; border-color: #e84545; animation: shake 0.3s; }
    .pin-error { font-size: 13px; color: #e84545; margin-bottom: 16px; height: 18px; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
    .key { height: 68px; border-radius: 14px; border: 1px solid #1e2d3d; background: #141f2b; color: #e8edf2; font-size: 22px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
    .key:active { background: #1e2d3d; }
    .key.del { font-size: 18px; color: #4a6785; }
    .key.empty { border: none; background: transparent; cursor: default; }
    .pin-link { margin-top: 28px; font-size: 13px; color: #4a6785; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const RATE = 0.725;
    const STORAGE_KEY = "mileage-trips-v1";
    const PIN_KEY = "mileage-pin";
    const UNLOCK_KEY = "mileage-unlocked-until";
    const UNLOCK_HOURS = 24;

    const todayStr = () => new Date().toISOString().split("T")[0];

    function getWeekStart(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const dow = d.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      const mon = new Date(d);
      mon.setDate(d.getDate() + diff);
      return mon.toISOString().split("T")[0];
    }

    function fmtWeek(ws) {
      const mon = new Date(ws + "T12:00:00");
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      const s = { month: "short", day: "numeric" };
      return `${mon.toLocaleDateString("en-US", s)} – ${sun.toLocaleDateString("en-US", { ...s, year: "numeric" })}`;
    }

    function fmtDate(ds) {
      return new Date(ds + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }

    // ── PIN Screen ───────────────────────────────────────────
    function PinScreen({ mode, onSuccess, onForgot }) {
      const [digits, setDigits] = useState([]);
      const [confirm, setConfirm] = useState(null);
      const [error, setError] = useState("");
      const [shake, setShake] = useState(false);

      const step = mode === "setup"
        ? (confirm === null ? "Choose a 6-digit PIN" : "Confirm your PIN")
        : "Enter your PIN";

      const sub = mode === "setup"
        ? (confirm === null ? "You'll only need to set this once." : "Re-enter your PIN to confirm.")
        : "Unlock your mileage tracker.";

      const triggerError = (msg) => {
        setError(msg);
        setShake(true);
        setTimeout(() => { setDigits([]); setShake(false); }, 600);
      };

      const handleKey = (k) => {
        if (digits.length >= 6) return;
        const next = [...digits, k];
        setDigits(next);
        setError("");

        if (next.length === 6) {
          const pin = next.join("");
          if (mode === "setup") {
            if (confirm === null) {
              setTimeout(() => { setConfirm(pin); setDigits([]); }, 200);
            } else {
              if (pin === confirm) {
                localStorage.setItem(PIN_KEY, pin);
                localStorage.setItem(UNLOCK_KEY, Date.now() + UNLOCK_HOURS * 3600000);
                onSuccess();
              } else {
                setConfirm(null);
                triggerError("PINs didn't match. Try again.");
              }
            }
          } else {
            const stored = localStorage.getItem(PIN_KEY);
            if (pin === stored) {
              localStorage.setItem(UNLOCK_KEY, Date.now() + UNLOCK_HOURS * 3600000);
              onSuccess();
            } else {
              triggerError("Incorrect PIN. Try again.");
            }
          }
        }
      };

      const handleDel = () => setDigits(d => d.slice(0, -1));

      const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];

      return (
        <div className="pin-screen">
          <div className="pin-icon">🔒</div>
          <div className="pin-title">{step}</div>
          <div className="pin-sub">{sub}</div>
          <div className="pin-dots">
            {[0,1,2,3,4,5].map(i => (
              <div key={i} className={`pin-dot ${digits.length > i ? (shake ? "error" : "filled") : ""}`} />
            ))}
          </div>
          <div className="pin-error">{error}</div>
          <div className="keypad">
            {keys.map((k, i) => (
              k === "del"
                ? <button key={i} className="key del" onClick={handleDel}>⌫</button>
                : k === ""
                  ? <div key={i} className="key empty" />
                  : <button key={i} className="key" onClick={() => handleKey(k)}>{k}</button>
            ))}
          </div>
          {mode === "unlock" && (
            <button className="pin-link" onClick={onForgot}>Forgot PIN?</button>
          )}
        </div>
      );
    }

    // ── Trip Form ────────────────────────────────────────────
    function TripForm({ initial, onSubmit, onClose, title, btnLabel }) {
      const [form, setForm] = useState(initial);
      const handle = () => {
        const miles = parseFloat(form.miles);
        if (!form.job.trim() || !miles || miles <= 0) return;
        onSubmit({ ...form, miles });
      };
      return (
        <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal">
            <div className="modal-hdr">
              <span className="modal-title">{title}</span>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>
            <label className="field-label">Date</label>
            <input className="field-input" type="date" value={form.date}
              onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
            <label className="field-label">Job Name</label>
            <input className="field-input" type="text" value={form.job} placeholder="e.g. Smith Residence"
              onChange={e => setForm(f => ({ ...f, job: e.target.value }))} />
            <label className="field-label">Miles</label>
            <input className="field-input" type="number" inputMode="decimal" value={form.miles} placeholder="0.0"
              onChange={e => setForm(f => ({ ...f, miles: e.target.value }))} />
            <button className="submit-btn" onClick={handle}>{btnLabel}</button>
          </div>
        </div>
      );
    }

    // ── Main App ─────────────────────────────────────────────
    function App() {
      const pinSet = !!localStorage.getItem(PIN_KEY);
      const unlockedUntil = parseInt(localStorage.getItem(UNLOCK_KEY) || "0");
      const isUnlocked = Date.now() < unlockedUntil;

      const [screen, setScreen] = useState(
        !pinSet ? "setup" : isUnlocked ? "app" : "lock"
      );
      const [trips, setTrips] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
      });
      const [tab, setTab] = useState("log");
      const [showAdd, setShowAdd] = useState(false);
      const [editTrip, setEditTrip] = useState(null);
      const [delConfirm, setDelConfirm] = useState(null);
      const [showChangePIN, setShowChangePIN] = useState(false);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); } catch (_) {}
      }, [trips]);

      const handleForgotPin = () => {
        if (window.confirm("Reset PIN? Your trip data will be kept.")) {
          localStorage.removeItem(PIN_KEY);
          localStorage.removeItem(UNLOCK_KEY);
          setScreen("setup");
        }
      };

      const addTrip = ({ date, job, miles }) => {
        const t = { id: Date.now().toString(), date, job, miles, reported: false, weekStart: getWeekStart(date) };
        setTrips(p => [...p, t].sort((a, b) => b.date.localeCompare(a.date)));
        setShowAdd(false);
      };

      const saveEdit = ({ date, job, miles }) => {
        setTrips(p => p.map(t => t.id === editTrip.id
          ? { ...t, date, job, miles, weekStart: getWeekStart(date) }
          : t
        ).sort((a, b) => b.date.localeCompare(a.date)));
        setEditTrip(null);
      };

      const toggle = (id) => setTrips(p => p.map(t => t.id === id ? { ...t, reported: !t.reported } : t));
      const del = (id) => { setTrips(p => p.filter(t => t.id !== id)); setDelConfirm(null); };

      const unreportedMiles = trips.filter(t => !t.reported).reduce((s, t) => s + t.miles, 0);

      const weekMap = {};
      trips.forEach(t => {
        const ws = t.weekStart || getWeekStart(t.date);
        if (!weekMap[ws]) weekMap[ws] = [];
        weekMap[ws].push(t);
      });
      const weekKeys = Object.keys(weekMap).sort((a, b) => b.localeCompare(a));

      if (screen === "setup") return <PinScreen mode="setup" onSuccess={() => setScreen("app")} />;
      if (screen === "lock") return <PinScreen mode="unlock" onSuccess={() => setScreen("app")} onForgot={handleForgotPin} />;

      return (
        <div className="root">
          <div className="header">
            <div className="header-top">
              <div className="header-icon">🚗</div>
              <div>
                <div className="header-title">Mileage Tracker</div>
                <div className="header-sub">$0.725 / MI</div>
              </div>
              <div className="header-right">
                <button className="settings-btn" onClick={() => setShowChangePIN(true)} title="Change PIN">⚙️</button>
              </div>
            </div>
            <div className="summary-row">
              <div className="sum-card sum-card-amber">
                <div className="sum-label sum-label-amber">Unreported Miles</div>
                <div className="sum-value sum-value-amber">{unreportedMiles.toFixed(1)}</div>
              </div>
              <div className="sum-card sum-card-green">
                <div className="sum-label sum-label-green">Est. Pay</div>
                <div className="sum-value sum-value-green">${(unreportedMiles * RATE).toFixed(2)}</div>
              </div>
            </div>
          </div>

          <div className="tabs">
            <button className={`tab-btn ${tab === "log" ? "active" : ""}`} onClick={() => setTab("log")}>📝 Log</button>
            <button className={`tab-btn ${tab === "weeks" ? "active" : ""}`} onClick={() => setTab("weeks")}>📊 Weekly</button>
          </div>

          <div className="content">
            {tab === "log" && (
              weekKeys.length === 0
                ? <div className="empty-state"><div className="empty-icon">🛣️</div>No trips yet.<br />Tap + to log your first one.</div>
                : weekKeys.map(ws => (
                  <div key={ws}>
                    <div className="week-hdr">
                      <span className="week-hdr-label">📅 {fmtWeek(ws)}</span>
                      <span className="week-hdr-total">{weekMap[ws].reduce((s, t) => s + t.miles, 0).toFixed(1)} mi</span>
                    </div>
                    {weekMap[ws].map(t => (
                      <div key={t.id} className={`card ${t.reported ? "reported" : ""}`}>
                        <div className="card-body">
                          <div className="card-date">{fmtDate(t.date)}</div>
                          <div className="card-job">{t.job}</div>
                          <div className="card-miles">{t.miles.toFixed(1)} mi · ${(t.miles * RATE).toFixed(2)}</div>
                        </div>
                        <div className="card-actions">
                          <button className={`icon-btn check ${t.reported ? "done" : ""}`} onClick={() => toggle(t.id)}>{t.reported ? "✓" : "○"}</button>
                          <button className="icon-btn edit" onClick={() => setEditTrip(t)}>✎</button>
                          <button className="icon-btn del" onClick={() => setDelConfirm(t.id)}>✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                ))
            )}

            {tab === "weeks" && (
              weekKeys.length === 0
                ? <div className="empty-state"><div className="empty-icon">📊</div>No data yet.</div>
                : weekKeys.map(ws => {
                  const wt = weekMap[ws];
                  const repMi = wt.filter(t => t.reported).reduce((s, t) => s + t.miles, 0);
                  const unrepMi = wt.filter(t => !t.reported).reduce((s, t) => s + t.miles, 0);
                  const totalMi = repMi + unrepMi;
                  return (
                    <div key={ws} className="week-card">
                      <div className="week-card-hdr">
                        <div className="week-card-title">📅 {fmtWeek(ws)}</div>
                        <div className="week-card-total">{totalMi.toFixed(1)} mi total · ${(totalMi * RATE).toFixed(2)}</div>
                      </div>
                      <div className="week-row">
                        <div className="row-dot row-dot-green" />
                        <span className="row-label">Reported</span>
                        <span className="row-miles">{repMi.toFixed(1)} mi</span>
                        <span className="row-pay row-pay-green">${(repMi * RATE).toFixed(2)}</span>
                      </div>
                      <div className="week-row">
                        <div className="row-dot row-dot-gray" />
                        <span className="row-label">Unreported</span>
                        <span className="row-miles">{unrepMi.toFixed(1)} mi</span>
                        <span className="row-pay row-pay-muted">${(unrepMi * RATE).toFixed(2)}</span>
                      </div>
                    </div>
                  );
                })
            )}
          </div>

          {tab === "log" && <button className="fab" onClick={() => setShowAdd(true)}>+</button>}

          {showAdd && <TripForm title="Add Trip" btnLabel="Add Trip" initial={{ date: todayStr(), job: "", miles: "" }} onSubmit={addTrip} onClose={() => setShowAdd(false)} />}
          {editTrip && <TripForm title="Edit Trip" btnLabel="Save Changes" initial={{ date: editTrip.date, job: editTrip.job, miles: String(editTrip.miles) }} onSubmit={saveEdit} onClose={() => setEditTrip(null)} />}

          {delConfirm && (
            <div className="confirm-overlay">
              <div className="confirm-box">
                <div className="confirm-title">Delete this trip?</div>
                <div className="confirm-sub">This can't be undone.</div>
                <div className="confirm-actions">
                  <button className="confirm-cancel" onClick={() => setDelConfirm(null)}>Cancel</button>
                  <button className="confirm-ok" onClick={() => del(delConfirm)}>Delete</button>
                </div>
              </div>
            </div>
          )}

          {showChangePIN && (
            <div className="confirm-overlay">
              <div className="confirm-box">
                <div className="confirm-title">⚙️ Settings</div>
                <div className="confirm-sub" style={{marginBottom: 16}}>Change your PIN?</div>
                <div className="confirm-actions">
                  <button className="confirm-cancel" onClick={() => setShowChangePIN(false)}>Cancel</button>
                  <button className="confirm-ok" onClick={() => { localStorage.removeItem(PIN_KEY); setShowChangePIN(false); setScreen("setup"); }}>Change PIN</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
